# Pilha local do run.bat (a produção roda nativa no Termux, ver decisão 0032). Execute a partir da raiz:
#   docker compose --env-file .env -f deploy/compose.yaml up -d
#   docker compose --env-file .env -f deploy/compose.yaml run --rm app migrate
#   docker compose --env-file .env -f deploy/compose.yaml run --rm backup backup

services:
  app:
    image: ${WREXERCISE_IMAGE:-wrexercise:latest}
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: ${DB_CONNECTION:?defina DB_CONNECTION no .env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${DATA_DIR:-/srv/wrexercise}/evidencias:/dados/evidencias
      - ${DATA_DIR:-/srv/wrexercise}/avatares:/dados/avatares
    mem_limit: 384m
    cpus: 0.50

  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wrexercise
      POSTGRES_USER: wrexercise
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - ${DATA_DIR:-/srv/wrexercise}/postgres:/var/lib/postgresql
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_wal_size=512MB
      - -c
      - checkpoint_completion_target=0.9
    # Por TCP: na primeira inicialização, o servidor temporário só atende pelo socket Unix.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U wrexercise -d wrexercise"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    cpus: 0.50

  # Só roda sob demanda: docker compose ... run --rm backup backup. Ver deploy/backup.sh.
  backup:
    image: postgres:18.6-alpine
    profiles: [backup]
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: wrexercise
      PGDATABASE: wrexercise
      PGPASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${DATA_DIR:-/srv/wrexercise}/evidencias:/dados/evidencias
      - ${DATA_DIR:-/srv/wrexercise}/avatares:/dados/avatares
      - ${BACKUP_DIR:-/srv/wrexercise/backups}:/backups
    mem_limit: 256m
    cpus: 0.50

  proxy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    mem_limit: 64m
    cpus: 0.10

volumes:
  caddy_data:
  caddy_config:
